services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: secondcurrent
      POSTGRES_PASSWORD: secondcurrent
      POSTGRES_DB: secondcurrent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondcurrent"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minio minio12345 &&
      mc mb --ignore-existing local/secondcurrent-private &&
      mc anonymous set none local/secondcurrent-private"
    restart: "no"
